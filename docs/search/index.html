<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>形式を探す — Train Bodies</title>
<meta name="description" content="日本を除く世界の鉄道車両の形式を、種類・国・製造者・軌間・最高速度などで絞り込んで探せます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="search.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="home" href="../">Train Bodies</a>
    <h1>形式を探す</h1>
  </header>

  <form class="qbar" id="qform" role="search" onsubmit="return false">
    <label for="q" class="vh">名前で探す</label>
    <input id="q" type="search" placeholder="名前・Q 番号（例: ICE、Class 411、Q696668）" autocomplete="off">
    <button type="button" id="ftoggle" class="ftoggle" aria-expanded="false" aria-controls="facets">絞り込み</button>
  </form>

  <div class="layout">
    <aside class="facets" id="facets" aria-label="絞り込み"></aside>
    <main class="results">
      <div class="bar">
        <p class="count" id="count" aria-live="polite">読み込み中…</p>
        <div class="tools">
          <label class="vh" for="sort">並べ方</label>
          <select id="sort"></select>
          <label class="vh" for="per">1 ページの件数</label>
          <select id="per"><option>24</option><option>48</option><option>96</option></select>
          <div class="seg" role="group" aria-label="表示">
            <button type="button" data-view="grid" aria-pressed="true">格子</button>
            <button type="button" data-view="list" aria-pressed="false">一覧</button>
          </div>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div id="out"></div>
      <nav class="pager" id="pager" aria-label="ページ送り"></nav>
    </main>
  </div>

  <footer class="note">
    <p>形式の一覧と項目の値は Wikidata（CC0）から取りました。日本の形式は除いています。写真は Wikimedia Commons のもので、クリックすると Wikidata の項目に移ります。</p>
  </footer>
</div>
<script src="search.js"></script>
</body>
</html>
